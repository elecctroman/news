<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bakım Modu</title>
    <style>
        body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
        .wrapper{text-align:center;padding:2rem;border-radius:1.5rem;background:#1e293b;box-shadow:0 20px 60px rgba(15,23,42,.6)}
        h1{font-size:2rem;margin-bottom:1rem}
        p{margin:0;font-size:1rem}
    </style>
</head>
<body>
<div class="wrapper">
    <h1>Sistem Bakımda</h1>
    <p>Alışveriş deneyiminizi iyileştirmek için kısa süreli bakımdayız. Lütfen daha sonra tekrar deneyin.</p>
</div>
</body>
</html>
